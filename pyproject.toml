[project]
name = "cipher-vault"
version = "0.1.0"
description = "Codebreaking puzzle architecture with a FastAPI adapter"
requires-python = ">=3.14"
dependencies = ["fastapi", "pydantic", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "ruff",
    "mypy",
    "import-linter",
    "defusedxml",
    "types-defusedxml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: exercises persistence using a file-backed SQLite database"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src", "tests", "scripts"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# Only rules the tool itself declares incompatible are left out; no code is excluded.
ignore = [
  # D203 and D211 are mutually exclusive (Ruff warns); keep D211 (no blank line before a class docstring).
  "D203",
  # D212 and D213 are mutually exclusive (Ruff warns); keep D212 (summary on the first line).
  "D213",
  # Conflicts with `ruff format` (Ruff documents it as unsafe to combine with the formatter).
  "COM812",
]

[tool.ruff.lint.per-file-ignores]
# pytest checks are written as `assert` statements (PT009/PT027 forbid the unittest forms),
# which S101 forbids: the two rule families ask for opposite things in tests, so tests keep
# the pytest style. Production code keeps S101.
"tests/**" = ["S101"]

[tool.importlinter]
root_package = "cipher_vault"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Adapters point inward and remain independent"
type = "layers"
containers = ["cipher_vault"]
layers = ["composition", "presentation | infrastructure", "application", "domain"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Core does not depend on web frameworks or validation adapters"
type = "forbidden"
source_modules = ["cipher_vault.domain", "cipher_vault.application"]
forbidden_modules = ["fastapi", "pydantic", "uvicorn"]
